<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>Listen in mewsic</title><style>body{margin:0;background:#0b090c;color:#f5f1f4;font:16px system-ui;display:grid;place-items:center;min-height:100dvh}main{max-width:420px;padding:32px;text-align:center}h1{font-size:32px;overflow-wrap:anywhere}p{color:#b6adb4}a{display:block;padding:16px 24px;background:#b92345;border-radius:18px;color:white;text-decoration:none;margin:24px 0}small{color:#b6adb4}</style><main><p>mewsic</p><h1 id="title">A song for you</h1><p id="artist"></p><a id="open">Play in mewsic</a><small>Requires mewsic installed on Android.</small></main><script>const q=new URLSearchParams(location.search),t=(q.get('title')||'').slice(0,400),a=(q.get('artist')||'').slice(0,200);document.getElementById('title').textContent=t||'A song for you';document.getElementById('artist').textContent=a;const params=new URLSearchParams({title:t,artist:a,play:'1'});const deep='mewsic://search?'+params;document.getElementById('open').href=/Android/i.test(navigator.userAgent)?'intent://search?'+params+'#Intent;scheme=mewsic;package=app.mewsic.nativeapp;end':deep;</script></html>
